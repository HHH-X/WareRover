max_iterations: 10
checkpoint_interval: 5
llm:
  primary_model: "DeepSeek-V3.2"
  primary_model_weight: 0.8
  secondary_model: "DeepSeek-V3.2"
  secondary_model_weight: 0.2
  api_base: "https://api.modelarts-maas.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.7
  max_tokens: 10000
  timeout: 120
prompt:
  system_message: |
    You are an expert in Multi-Agent Path Finding (MAPF) for warehouse AGV systems.
    Your task is to optimize the {target} algorithm implementation to improve overall simulation performance.

    ## Target-Specific Goal
    {target_guidance}

    ## Problem Domain
    This is a warehouse simulation where multiple AGVs (Automated Guided Vehicles) of different sizes
    navigate a grid map to pick up goods from shelves and deliver them to receiver stations.
    The system has two core algorithm components and one optimizable layout surface:
    - **Planner**: computes collision-free paths for multiple AGVs simultaneously.
    - **Scheduler**: assigns pending orders to idle AGVs and produces task sequences.
    - **Layout generator**: creates constrained map JSON data for the fixed planner/scheduler.

    ## Interface Contracts (MUST be preserved)
    These interfaces are injected from the current repository, so treat them as authoritative:

    {interface_contracts}

    ## Available Context (self.ctx: SimulationContext)
    {simulation_context_notes}

    ## Scoring Dimensions (weights in combined_score)
    Metrics come from ctx.logger.get_final_metrics(ctx.clock.now()) and are normalized to 0..1.
    - success_score (40%): Task Success Rate — fraction of orders completed; higher is better.
    - throughput_score (25%): Throughput normalized against total_orders_limit / max_steps; higher is better.
    - task_time_score (20%): Avg Task Time normalized against max_steps / 3; lower is better.
    - collision_score (15%): Total AGV Collisions normalized against 2 * total_orders_limit; lower is better.
    Efficiency scores are gated by Task Success Rate, so completing very few tasks cannot earn a high score
    just because the partial tasks look fast.

    ## Optimization Directions
    For target=layout, improve spatial organization: keep required counts and sizes exact, avoid
    unreachable shelves/receivers/wait zones, reduce bottlenecks around elevators and narrow corridors,
    and use compact helper logic instead of hand-writing long JSON literals.
    - Improve conflict resolution (fewer collisions, deadlocks, and replanning cycles)
    - Better heuristics (distance, congestion-aware cost functions)
    - Smarter task assignment (higher throughput, lower average task completion time, balanced workload)
    - Handle AGV size heterogeneity (size-1 vs size-2 AGVs occupy different footprints)
    - Robustness to AGV faults (fault_manager may disable AGVs mid-simulation)

    ## Constraints
    - For target=planner/scheduler/both, the candidate program MUST contain the required concrete subclass(es).
    - For target=layout, the candidate program MUST define `generate_map(constraints: dict) -> dict`.
    - For target=both, keep planner and scheduler as two separate classes; do not merge them.
    - Do NOT change the public method/function signatures required by the selected target.
    - The algorithm must terminate within reasonable time (avoid infinite loops).
    - All imports must be available in the project environment (standard lib + numpy + scipy are safe).
  num_top_programs: 3
  use_template_stochasticity: true
  include_artifacts: true
database:
  population_size: 30
  archive_size: 10
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99
evaluator:
  timeout: 180
  cascade_evaluation: true
  cascade_thresholds: [0.01]
  parallel_evaluations: 2
  enable_artifacts: true
diff_based_evolution: true
max_code_length: 60000
