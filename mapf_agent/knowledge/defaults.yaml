# Domain defaults for map generation (phase 1)
# Used to fill in reasonable values when user does not specify.

agv_sizes:
  small: 1
  medium: 1
  large: 2
  default: 1

map:
  width_min: 5
  width_max: 50
  height_min: 5
  height_max: 50
  default_width: 20
  default_height: 15

constraints:
  # wait_zones count must be >= number of AGVs; each AGV uses wait_zone_id == agv_id
  wait_zone_size_must_match_agv: true
  # Receiver and box sizes: 1 or 2; AGV can only pick box with same size
  allowed_sizes: [1, 2]
