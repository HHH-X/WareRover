<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Map Editor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #212529;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        h1 { color: #343a40; font-weight: 500; }
        #canvas-container {
            display: flex;
            justify-content: center;
            margin: 24px 0;
            overflow: auto;
        }
        canvas {
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
            cursor: crosshair;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            border-radius: 16px;
        }
        .sidebar {
            background-color: #f8f9fa;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
        }
        .btn-mode {
            margin: 6px 0;
            width: 100%;
            font-weight: 600;
        }
        .form-control, .form-select {
            margin-bottom: 10px;
        }
        #status {
            margin-top: 12px;
            font-size: 0.95em;
            color: #6c757d;
            font-weight: 500;
        }
        #export-btn {
            margin-top: 16px;
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            border: none;
            color: white;
            font-weight: 600;
        }
        .info-panel {
            background-color: #f8f9fa;
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid #dee2e6;
            margin-bottom: 16px;
            font-size: 1.02em;
        }
        .hint {
            color: #6c757d;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container-fluid px-4">
        <h1 class="text-center my-4">Warehouse Map Editor</h1>
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="sidebar">
                    <h5>Map</h5>
                    <div class="row g-2">
                        <div class="col-4">
                            <input id="width-input" class="form-control" type="number" min="1" value="20" title="Width">
                        </div>
                        <div class="col-4">
                            <input id="height-input" class="form-control" type="number" min="1" value="15" title="Height">
                        </div>
                        <div class="col-4">
                            <input id="floors-input" class="form-control" type="number" min="1" value="1" title="Floors">
                        </div>
                    </div>
                    <button class="btn btn-outline-primary w-100 mb-3" onclick="applyMapSettings()">Apply Map Settings</button>

                    <label class="form-label">Current Floor</label>
                    <select id="floor-select" class="form-select" onchange="setCurrentFloor(parseInt(this.value, 10))"></select>

                    <hr>
                    <h5>Mode & Size</h5>
                    <button class="btn btn-mode" style="background:#0d6efd;color:white;" onclick="setMode(1)">Shelf</button>
                    <button class="btn btn-mode" style="background:#dc3545;color:white;" onclick="setMode(2)">Receiver</button>
                    <button class="btn btn-mode" style="background:#6c757d;color:white;" onclick="setMode(3)">Obstacle</button>
                    <button class="btn btn-mode" style="background:#198754;color:white;" onclick="setMode(4)">Wait Zone (AGV)</button>
                    <button class="btn btn-mode" style="background:#fd7e14;color:white;" onclick="setMode(5)">Elevator</button>

                    <select id="size-select" class="form-select" onchange="currentSize = parseInt(this.value, 10)">
                        <option value="1" selected>Size = 1</option>
                        <option value="2">Size = 2</option>
                    </select>
                    <input id="goods-ids-input" class="form-control" type="text" placeholder="Shelf goods IDs, e.g. 100,101">

                    <hr>
                    <h5>Elevator</h5>
                    <input id="elevator-floors-input" class="form-control" type="text" placeholder="Connected floors, e.g. 0,1">
                    <input id="elevator-travel-input" class="form-control" type="number" min="1" value="5" placeholder="Travel time">

                    <p class="hint">
                        Left click: place at top-left cell<br>
                        Right click: remove whole object<br>
                        Positions export as [row, col]
                    </p>

                    <button id="export-btn" class="btn btn-lg w-100" onclick="exportMap()">Export Map (S / Enter)</button>
                    <button id="reset-btn" class="btn btn-secondary w-100 mt-2" onclick="resetMap()">Reset Map</button>
                    <div id="status"></div>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="info-panel">
                    <span id="summary">Floor 0</span>
                </div>
                <div id="canvas-container">
                    <canvas id="map-canvas" width="900" height="675"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TYPE_EMPTY = 0;
        const TYPE_SHELF = 1;
        const TYPE_RECEIVER = 2;
        const TYPE_OBSTACLE = 3;
        const TYPE_WAIT = 4;
        const TYPE_ELEVATOR = 5;
        const CELL = 45;

        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');

        let mapWidth = 20;
        let mapHeight = 15;
        let floorCount = 1;
        let currentFloor = 0;
        let mode = TYPE_SHELF;
        let currentSize = 1;
        let floors = [];
        let elevators = [];

        const colors = {
            [TYPE_EMPTY]: '#f8f9fa',
            [TYPE_SHELF]: '#0d6efd',
            [TYPE_RECEIVER]: '#dc3545',
            [TYPE_OBSTACLE]: '#6c757d',
            [TYPE_WAIT]: '#198754',
            [TYPE_ELEVATOR]: '#fd7e14'
        };
        const modeNames = {
            [TYPE_SHELF]: 'Shelf',
            [TYPE_RECEIVER]: 'Receiver',
            [TYPE_OBSTACLE]: 'Obstacle',
            [TYPE_WAIT]: 'Wait Zone',
            [TYPE_ELEVATOR]: 'Elevator'
        };

        function makeFloor() {
            return {
                grid: Array.from({ length: mapHeight }, () => Array(mapWidth).fill(TYPE_EMPTY)),
                objects: {}
            };
        }

        function initState() {
            floors = Array.from({ length: floorCount }, makeFloor);
            elevators = [];
            currentFloor = Math.min(currentFloor, floorCount - 1);
            resizeCanvas();
            buildFloorSelect();
            seedElevatorFloorsInput();
            drawGrid();
        }

        function resizeCanvas() {
            canvas.width = mapWidth * CELL;
            canvas.height = mapHeight * CELL;
        }

        function buildFloorSelect() {
            const select = document.getElementById('floor-select');
            select.innerHTML = '';
            for (let f = 0; f < floorCount; f++) {
                const option = document.createElement('option');
                option.value = String(f);
                option.textContent = `Floor ${f}`;
                select.appendChild(option);
            }
            select.value = String(currentFloor);
        }

        function seedElevatorFloorsInput() {
            document.getElementById('elevator-floors-input').value =
                Array.from({ length: floorCount }, (_, i) => i).join(',');
        }

        function applyMapSettings() {
            const nextWidth = parseInt(document.getElementById('width-input').value, 10);
            const nextHeight = parseInt(document.getElementById('height-input').value, 10);
            const nextFloors = parseInt(document.getElementById('floors-input').value, 10);
            if (!Number.isInteger(nextWidth) || !Number.isInteger(nextHeight) || !Number.isInteger(nextFloors) ||
                nextWidth < 1 || nextHeight < 1 || nextFloors < 1) {
                setStatus('Map width, height, and floors must be positive integers.', '#dc3545');
                return;
            }
            mapWidth = nextWidth;
            mapHeight = nextHeight;
            floorCount = nextFloors;
            initState();
            setStatus('Map settings applied.', '#198754');
        }

        function setCurrentFloor(floorId) {
            if (floorId < 0 || floorId >= floorCount) return;
            currentFloor = floorId;
            drawGrid();
        }

        function setMode(newMode) {
            mode = newMode;
            setStatus(`Current Mode: ${modeNames[mode]}`, colors[mode]);
        }

        function parseCsvInts(value) {
            return value.split(',')
                .map(part => parseInt(part.trim(), 10))
                .filter(Number.isInteger);
        }

        function getShelfGoodsIds() {
            return [...new Set(parseCsvInts(document.getElementById('goods-ids-input').value))];
        }

        function getElevatorFloors() {
            return [...new Set(parseCsvInts(document.getElementById('elevator-floors-input').value))]
                .filter(f => f >= 0 && f < floorCount)
                .sort((a, b) => a - b);
        }

        function inBounds(row, col, size) {
            return row >= 0 && col >= 0 && row + size <= mapHeight && col + size <= mapWidth;
        }

        function canPlaceOnFloor(floorId, row, col, size) {
            if (!inBounds(row, col, size)) return false;
            const grid = floors[floorId].grid;
            for (let dr = 0; dr < size; dr++) {
                for (let dc = 0; dc < size; dc++) {
                    if (grid[row + dr][col + dc] !== TYPE_EMPTY) return false;
                }
            }
            return true;
        }

        function fillArea(floorId, row, col, size, type) {
            const grid = floors[floorId].grid;
            for (let dr = 0; dr < size; dr++) {
                for (let dc = 0; dc < size; dc++) {
                    grid[row + dr][col + dc] = type;
                }
            }
        }

        function placeObject(row, col) {
            const size = mode === TYPE_OBSTACLE ? 1 : currentSize;
            if (!canPlaceOnFloor(currentFloor, row, col, size)) {
                setStatus('Cannot place: area occupied or out of bounds.', '#dc3545');
                return false;
            }

            const obj = { type: mode, size };
            if (mode === TYPE_SHELF) {
                const goodsIds = getShelfGoodsIds();
                if (goodsIds.length > 0) obj.goods_ids = goodsIds;
            }
            floors[currentFloor].objects[`${row},${col}`] = obj;
            fillArea(currentFloor, row, col, size, mode);
            return true;
        }

        function placeElevator(row, col) {
            const connectedFloors = getElevatorFloors();
            const travelTime = parseInt(document.getElementById('elevator-travel-input').value, 10);
            if (connectedFloors.length === 0 || !connectedFloors.includes(currentFloor)) {
                setStatus('Elevator floors must include the current floor.', '#dc3545');
                return false;
            }
            if (!Number.isInteger(travelTime) || travelTime < 1) {
                setStatus('Elevator travel time must be a positive integer.', '#dc3545');
                return false;
            }
            for (const floorId of connectedFloors) {
                if (!canPlaceOnFloor(floorId, row, col, currentSize)) {
                    setStatus(`Cannot place elevator: blocked on floor ${floorId}.`, '#dc3545');
                    return false;
                }
            }

            const elevator = {
                elevator_id: elevators.length,
                position: [row, col],
                floors: connectedFloors,
                travel_time: travelTime,
                size: currentSize
            };
            elevators.push(elevator);
            for (const floorId of connectedFloors) {
                fillArea(floorId, row, col, currentSize, TYPE_ELEVATOR);
            }
            return true;
        }

        function findObjectKeyAt(floorId, row, col) {
            const objects = floors[floorId].objects;
            for (const key in objects) {
                const [objRow, objCol] = key.split(',').map(Number);
                const size = objects[key].size;
                if (row >= objRow && row < objRow + size && col >= objCol && col < objCol + size) {
                    return key;
                }
            }
            return null;
        }

        function findElevatorAt(floorId, row, col) {
            return elevators.find(elevator => {
                const [erow, ecol] = elevator.position;
                return elevator.floors.includes(floorId) &&
                    row >= erow && row < erow + elevator.size &&
                    col >= ecol && col < ecol + elevator.size;
            });
        }

        function removeObjectAt(row, col) {
            const cellType = floors[currentFloor].grid[row][col];
            if (cellType === TYPE_EMPTY) return false;

            if (cellType === TYPE_ELEVATOR) {
                const elevator = findElevatorAt(currentFloor, row, col);
                if (!elevator) return false;
                const [erow, ecol] = elevator.position;
                for (const floorId of elevator.floors) {
                    fillArea(floorId, erow, ecol, elevator.size, TYPE_EMPTY);
                }
                elevators = elevators.filter(item => item !== elevator);
                elevators.forEach((item, index) => item.elevator_id = index);
                return true;
            }

            const key = findObjectKeyAt(currentFloor, row, col);
            if (!key) return false;
            const [objRow, objCol] = key.split(',').map(Number);
            const obj = floors[currentFloor].objects[key];
            fillArea(currentFloor, objRow, objCol, obj.size, TYPE_EMPTY);
            delete floors[currentFloor].objects[key];
            return true;
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const floor = floors[currentFloor];
            for (let row = 0; row < mapHeight; row++) {
                for (let col = 0; col < mapWidth; col++) {
                    const type = floor.grid[row][col];
                    ctx.fillStyle = colors[type];
                    ctx.fillRect(col * CELL, row * CELL, CELL, CELL);
                    ctx.strokeStyle = '#dee2e6';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(col * CELL, row * CELL, CELL, CELL);
                }
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 13px Arial';
            drawObjectLabels(floor.objects);
            drawElevatorLabels();
            updateSummary();
        }

        function drawObjectLabels(objects) {
            const labelByType = {
                [TYPE_SHELF]: 'S',
                [TYPE_RECEIVER]: 'R',
                [TYPE_OBSTACLE]: 'O',
                [TYPE_WAIT]: 'W'
            };
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            for (const key in objects) {
                const [row, col] = key.split(',').map(Number);
                const obj = objects[key];
                const label = obj.size > 1 ? `${labelByType[obj.type]} ${obj.size}x${obj.size}` : labelByType[obj.type];
                ctx.fillText(label, (col + obj.size / 2) * CELL, (row + obj.size / 2) * CELL);
            }
        }

        function drawElevatorLabels() {
            ctx.fillStyle = 'rgba(255,255,255,0.96)';
            for (const elevator of elevators) {
                if (!elevator.floors.includes(currentFloor)) continue;
                const [row, col] = elevator.position;
                const label = `E${elevator.elevator_id} ${elevator.size}x${elevator.size}`;
                ctx.fillText(label, (col + elevator.size / 2) * CELL, (row + elevator.size / 2) * CELL);
            }
        }

        function updateSummary() {
            const waitCount = floors.reduce((sum, floor) =>
                sum + Object.values(floor.objects).filter(obj => obj.type === TYPE_WAIT).length, 0);
            document.getElementById('summary').textContent =
                `Floor ${currentFloor} / ${floorCount - 1} | Elevators: ${elevators.length} | Wait Zones: ${waitCount} -> AGVs: ${waitCount}`;
        }

        function resetMap() {
            initState();
            document.getElementById('goods-ids-input').value = '';
            setStatus('Map has been reset.', '#198754');
        }

        function setStatus(message, color = '#6c757d') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.color = color;
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const col = Math.floor((e.clientX - rect.left) / CELL);
            const row = Math.floor((e.clientY - rect.top) / CELL);
            if (row < 0 || row >= mapHeight || col < 0 || col >= mapWidth) return;

            if (e.button === 0) {
                const placed = mode === TYPE_ELEVATOR ? placeElevator(row, col) : placeObject(row, col);
                if (placed) drawGrid();
            } else if (e.button === 2) {
                if (removeObjectAt(row, col)) drawGrid();
            }
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', (e) => {
            if (e.key === 's' || e.key === 'Enter') {
                exportMap();
            }
        });

        function exportFloor(floor, floorId, counters) {
            const boxes = [];
            const receivers = [];
            const waitZones = [];
            const agvs = [];
            const obstacles = [];

            for (const key in floor.objects) {
                const [row, col] = key.split(',').map(Number);
                const obj = floor.objects[key];
                const item = { position: [row, col] };
                if (obj.size > 1) item.size = obj.size;

                if (obj.type === TYPE_SHELF) {
                    item.box_id = counters.box++;
                    item.goods_ids = obj.goods_ids && obj.goods_ids.length > 0 ? obj.goods_ids : [item.box_id];
                    boxes.push(item);
                } else if (obj.type === TYPE_RECEIVER) {
                    item.receiver_id = counters.receiver++;
                    receivers.push(item);
                } else if (obj.type === TYPE_WAIT) {
                    item.wait_zone_id = counters.wait++;
                    waitZones.push(item);
                    const agv = { agv_id: counters.agv++ };
                    if (obj.size > 1) agv.size = obj.size;
                    agvs.push(agv);
                } else if (obj.type === TYPE_OBSTACLE) {
                    obstacles.push([row, col]);
                }
            }

            return {
                floor_id: floorId,
                boxes,
                receivers,
                wait_zones: waitZones,
                agvs,
                obstacles
            };
        }

        function exportMap() {
            const counters = { box: 0, receiver: 0, wait: 0, agv: 0 };
            const mapData = {
                map: {
                    width: mapWidth,
                    height: mapHeight,
                    floors: floorCount
                },
                floors: floors.map((floor, index) => exportFloor(floor, index, counters)),
                elevators: elevators.map(elevator => ({
                    elevator_id: elevator.elevator_id,
                    position: elevator.position,
                    floors: elevator.floors,
                    travel_time: elevator.travel_time,
                    size: elevator.size
                }))
            };

            const now = new Date();
            const ts = `${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;
            const filename = `map_${ts}.json`;

            const blob = new Blob([JSON.stringify(mapData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);

            setStatus(`Exported ${filename} (${counters.agv} AGVs, ${elevators.length} elevators).`, '#0d6efd');
        }

        initState();
        setMode(TYPE_SHELF);
    </script>
</body>
</html>
