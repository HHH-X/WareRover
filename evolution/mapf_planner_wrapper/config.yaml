max_iterations: 10
checkpoint_interval: 5

llm:
  primary_model: "gemini-2.5-flash-lite"
  primary_model_weight: 0.8
  secondary_model: "gemini-2.5-flash"
  secondary_model_weight: 0.2
  manual_mode: true
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120

prompt:
  system_message: "You are optimizing a MAPF planner helper function named rank_targets. Keep the function deterministic and robust. It must return an ordered list of agv_id values based only on provided target_rows and current_step. Do not import heavy dependencies."

database:
  population_size: 24
  archive_size: 8
  num_islands: 2
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 180
  parallel_evaluations: 2

diff_based_evolution: true
max_code_length: 12000
